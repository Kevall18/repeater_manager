name: repeater_manager
description: "A Flutter multi-platform app for managing repeaters"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.1.0
  connectivity_plus: ^6.1.5
  equatable: ^2.0.7
  flutter_bloc: ^9.1.0
  go_router: ^16.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
